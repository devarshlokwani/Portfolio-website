<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Google shows a generic globe in search results when it cannot find a
         favicon it will use, and it probes /favicon.ico directly as well as
         reading these tags. An SVG on its own was leaving it with nothing to
         fall back to. All of these are the same artwork, rendered from
         favicon.svg, so there is one drawing to maintain. -->
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Devarsh Lokwani, graduate software engineer and full-stack developer building end-to-end web and mobile products with React, TypeScript, and Node.js."
    />
    <meta name="theme-color" content="#0a0a0c" />

    <!-- Absolute URLs, filled in at build time from VITE_SITE_URL. Link
         scrapers do not resolve a relative og:image against the page they
         found it on, so a path alone leaves the preview blank, and there is
         no hostname written down here to go stale when the domain changes. -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:site_name" content="Devarsh Lokwani" />
    <meta property="og:title" content="Devarsh Lokwani | Software Engineer" />
    <meta
      property="og:description"
      content="Graduate software engineer and full-stack developer. React, TypeScript, Node.js."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1424" />
    <meta property="og:image:height" content="752" />
    <meta property="og:image:alt" content="Devarsh Lokwani, graduate software engineer, Sydney" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Devarsh Lokwani | Software Engineer" />
    <meta
      name="twitter:description"
      content="Graduate software engineer and full-stack developer. React, TypeScript, Node.js."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta name="twitter:image:alt" content="Devarsh Lokwani, graduate software engineer, Sydney" />

    <title>Devarsh Lokwani | Software Engineer</title>
    <script>
      // Applied before paint to avoid a flash of the wrong theme.
      try {
        var stored = localStorage.getItem('theme-preference')
        if (stored === 'light') {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
